<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=393, height=852, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Semester Progress</title>
  <style>
    /* 1. Global Reset & iPhone 14 Pro Viewport Locking */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 393px !important;
      height: 852px !important;
      min-width: 393px !important;
      min-height: 852px !important;
      max-width: 393px !important;
      max-height: 852px !important;
      overflow: hidden;
      background: url('IMG_4290.jpeg') no-repeat center center !important;
      background-size: cover !important;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    #capture-wrapper {
      width: 393px;
      height: 852px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      /* Precisely places grid above the camera & flashlight icons */
      padding-bottom: 75px;
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    .timeline {
      display: flex;
      flex-direction: column;
      gap: 3px;
      background: rgba(0, 0, 0, 0.15); 
      padding: 10px;
      border-radius: 14px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .week-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .week-label {
      font-size: 10px;
      color: #ffffff;
      font-weight: bold;
      width: 22px;
      text-align: right;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
    }

    .days-grid { 
      display: grid; 
      grid-template-columns: repeat(7, 1fr); 
      gap: 4px; 
    }

    .day { 
      width: 25px; 
      height: 25px; 
      border-radius: 5px; 
      border: 1px solid rgba(255, 255, 255, 0.35); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 9px; 
      color: #ffffff; 
      font-weight: bold;
      background-color: rgba(0, 0, 0, 0.2);
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.9);
    }

    /* Finished Days -> Puce */
    .past { 
      background-color: #CC8899 !important; 
      border-color: #CC8899 !important; 
      color: #ffffff !important; 
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    /* Today -> Wild Orchid */
    .current { 
      background-color: #D470A2 !important; 
      border-color: #D470A2 !important; 
      color: #ffffff !important; 
      box-shadow: 0 0 10px #D470A2;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    }

    /* Print & WebKit Screen Capture Overrides */
    @media print {
      @page {
        margin: 0 !important;
        size: 393px 852px;
      }
      html, body {
        margin: 0 !important;
        padding: 0 !important;
        background: url('IMG_4290.jpeg') no-repeat center center !important;
        background-size: cover !important;
        height: 852px !important;
        width: 393px !important;
        overflow: hidden !important;
        justify-content: flex-end !important;
        align-items: center !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      #capture-wrapper {
        height: 852px !important;
        width: 393px !important;
        padding-bottom: 75px !important;
      }
    }
  </style>
</head>
<body>

  <div id="capture-wrapper">
    <div class="timeline" id="semesterTimeline"></div>
  </div>

  <script>
    const startDate = new Date("2026-09-07"); 
    const totalWeeks = 14;

    const today = new Date();
    today.setHours(0,0,0,0);
    startDate.setHours(0,0,0,0);

    const timeDiff = today - startDate;
    const daysPassed = Math.floor(timeDiff / (1000 * 60 * 60 * 24));

    const timelineContainer = document.getElementById('semesterTimeline');
    let dayCounter = 0;

    for (let w = 1; w <= totalWeeks; w++) {
      const row = document.createElement('div');
      row.classList.add('week-row');

      const label = document.createElement('div');
      label.classList.add('week-label');
      label.innerText = 'W' + w;
      row.appendChild(label);

      const daysGrid = document.createElement('div');
      daysGrid.classList.add('days-grid');

      for (let d = 0; d < 7; d++) {
        const dayBox = document.createElement('div');
        dayBox.classList.add('day');
        dayBox.innerText = dayCounter + 1;

        if (dayCounter < daysPassed) {
          dayBox.classList.add('past'); 
        } else if (dayCounter === daysPassed) {
          dayBox.classList.add('current'); 
        }
        
        daysGrid.appendChild(dayBox);
        dayCounter++;
      }

      row.appendChild(daysGrid);
      timelineContainer.appendChild(row);
    }
  </script>
</body>
</html>
