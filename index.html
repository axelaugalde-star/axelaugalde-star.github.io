<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semester Progress</title>
  <style>
    /* 1. Base page styles with background image */
    html, body {
      /* Replace 'your-image-url.jpg' with your image link or path */
      background: url('https://pin.it/5pxC7Wodo') no-repeat center center fixed !important;
      background-size: cover !important;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    #capture-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding: 20px 20px 120px 20px;
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* Container holding all rows */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 8px;
      /* Semi-transparent backdrop to keep text/boxes readable over the image */
      background: rgba(10, 25, 47, 0.75);
      padding: 16px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
    }

    /* Single row layout: Week Label on left, 7 Days on right */
    .week-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    /* Style for Week Labels (W1, W2, etc.) */
    .week-label {
      font-size: 12px;
      color: #cbd5e1;
      font-weight: bold;
      width: 28px;
      text-align: right;
    }

    /* Grid layout for the 7 days inside a week */
    .days-grid { 
      display: grid; 
      grid-template-columns: repeat(7, 1fr); 
      gap: 6px; 
    }

    .day { 
      width: 32px; 
      height: 32px; 
      border-radius: 6px; 
      border: 2px solid rgba(255, 255, 255, 0.2); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 10px; 
      color: #e2e8f0; 
      font-weight: bold;
      background-color: rgba(15, 23, 42, 0.6);
      box-sizing: border-box;
    }

    /* Days you have finished */
    .past { 
      background-color: #2ed573 !important; 
      border-color: #2ed573 !important; 
      color: #0a192f !important; 
    }

    /* Today */
    .current { 
      background-color: #ffa502 !important; 
      border-color: #ffa502 !important; 
      color: black !important; 
      box-shadow: 0 0 12px #ffa502;
    }

    /* 2. Retains the image during PDF capture */
    @media print {
      @page {
        margin: 0;
        size: auto;
      }
      html, body {
        background: url('your-image-url.jpg') no-repeat center center !important;
        background-size: cover !important;
        height: 100vh !important;
        width: 100vw !important;
        justify-content: flex-end !important;
        align-items: flex-end !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .day, .timeline {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>
</head>
<body>

  <div id="capture-wrapper">
    <div class="timeline" id="semesterTimeline"></div>
  </div>

  <script>
    const startDate = new Date("2026-09-07"); 
    const totalWeeks = 14;

    const today = new Date();
    today.setHours(0,0,0,0);
    startDate.setHours(0,0,0,0);

    const timeDiff = today - startDate;
    const daysPassed = Math.floor(timeDiff / (1000 * 60 * 60 * 24));

    const timelineContainer = document.getElementById('semesterTimeline');
    let dayCounter = 0;

    for (let w = 1; w <= totalWeeks; w++) {
      const row = document.createElement('div');
      row.classList.add('week-row');

      const label = document.createElement('div');
      label.classList.add('week-label');
      label.innerText = 'W' + w;
      row.appendChild(label);

      const daysGrid = document.createElement('div');
      daysGrid.classList.add('days-grid');

      for (let d = 0; d < 7; d++) {
        const dayBox = document.createElement('div');
        dayBox.classList.add('day');
        dayBox.innerText = dayCounter + 1;

        if (dayCounter < daysPassed) {
          dayBox.classList.add('past'); 
        } else if (dayCounter === daysPassed) {
          dayBox.classList.add('current'); 
        }
        
        daysGrid.appendChild(dayBox);
        dayCounter++;
      }

      row.appendChild(daysGrid);
      timelineContainer.appendChild(row);
    }
  </script>
</body>
</html>
