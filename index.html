<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semester Progress</title>
  <style>
    html, body {
      background: url('IMG_4290.jpeg') no-repeat center center fixed !important;
      background-size: cover !important;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* Positions layout toward the bottom */
      justify-content: flex-end;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    #capture-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      /* Higher top padding lowers the timetable on screen */
      padding: 180px 16px 60px 16px;
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* Less translucent overlay for higher opacity */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: rgba(10, 15, 25, 0.85); /* Darker, less see-through background */
      padding: 14px;
      border-radius: 14px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .week-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .week-label {
      font-size: 11px;
      color: #ffffff;
      font-weight: bold;
      width: 24px;
      text-align: right;
    }

    .days-grid { 
      display: grid; 
      grid-template-columns: repeat(7, 1fr); 
      gap: 4px; 
    }

    /* Solid day boxes to improve readability */
    .day { 
      width: 26px; 
      height: 26px; 
      border-radius: 5px; 
      border: 1px solid rgba(255, 255, 255, 0.3); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 9px; 
      color: #ffffff; 
      font-weight: bold;
      background-color: rgba(15, 23, 42, 0.8);
      box-sizing: border-box;
    }

    /* Days finished */
    .past { 
      background-color: #2ed573 !important; 
      border-color: #2ed573 !important; 
      color: #000000 !important; 
    }

    /* Today */
    .current { 
      background-color: #ffa502 !important; 
      border-color: #ffa502 !important; 
      color: black !important; 
      box-shadow: 0 0 10px #ffa502;
    }

    @media print {
      @page {
        margin: 0;
        size: auto;
      }
      html, body {
        background: url('IMG_4290.jpeg') no-repeat center center !important;
        background-size: cover !important;
        height: 100vh !important;
        width: 100vw !important;
        justify-content: flex-end !important;
        align-items: center !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .day, .timeline {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>
</head>
<body>

  <div id="capture-wrapper">
    <div class="timeline" id="semesterTimeline"></div>
  </div>

  <script>
    const startDate = new Date("2026-09-07"); 
    const totalWeeks = 14;

    const today = new Date();
    today.setHours(0,0,0,0);
    startDate.setHours(0,0,0,0);

    const timeDiff = today - startDate;
    const daysPassed = Math.floor(timeDiff / (1000 * 60 * 60 * 24));

    const timelineContainer = document.getElementById('semesterTimeline');
    let dayCounter = 0;

    for (let w = 1; w <= totalWeeks; w++) {
      const row = document.createElement('div');
      row.classList.add('week-row');

      const label = document.createElement('div');
      label.classList.add('week-label');
      label.innerText = 'W' + w;
      row.appendChild(label);

      const daysGrid = document.createElement('div');
      daysGrid.classList.add('days-grid');

      for (let d = 0; d < 7; d++) {
        const dayBox = document.createElement('div');
        dayBox.classList.add('day');
        dayBox.innerText = dayCounter + 1;

        if (dayCounter < daysPassed) {
          dayBox.classList.add('past'); 
        } else if (dayCounter === daysPassed) {
          dayBox.classList.add('current'); 
        }
        
        daysGrid.appendChild(dayBox);
        dayCounter++;
      }

      row.appendChild(daysGrid);
      timelineContainer.appendChild(row);
    }
  </script>
</body>
</html>
