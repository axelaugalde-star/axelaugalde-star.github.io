<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semester Progress</title>
  <style>
    /* 1. Apply background-color to both html and body */
    html, body { 
      background-color: #121212 !important; 
      color: white; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      min-height: 100vh; /* Changed from height to min-height */
      margin: 0; 
      box-sizing: border-box;
    }
    h2 { 
      margin-bottom: 25px; 
      font-weight: 500; 
      letter-spacing: 1px;
      color: #eaeaea;
    }
    
    /* Dedicated capture wrapper ensuring a solid dark fill */
    #capture-wrapper {
      background-color: #121212;
      padding: 20px;
      border-radius: 12px;
    }

    /* Container holding all rows */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    /* Single row layout: Week Label on left, 7 Days on right */
    .week-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    /* Style for Week Labels (W1, W2, etc.) */
    .week-label {
      font-size: 12px;
      color: #888;
      font-weight: bold;
      width: 28px; /* Fixed width keeps columns lined up */
      text-align: right;
    }
    /* Grid layout for the 7 days inside a week */
    .days-grid { 
      display: grid; 
      grid-template-columns: repeat(7, 1fr); 
      gap: 6px; 
    }
    .day { 
      width: 32px; 
      height: 32px; 
      border-radius: 6px; 
      border: 2px solid #333; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 10px; 
      color: #555; 
      font-weight: bold;
    }
    /* Days you have finished */
    .past { 
      background-color: #2ed573; 
      border-color: #2ed573; 
      color: #121212; 
    }
    /* Today */
    .current { 
      background-color: #ffa502; 
      border-color: #ffa502; 
      color: black; 
      box-shadow: 0 0 12px #ffa502;
    }
  </style>
</head>
<body>

  <!-- Wrapper guarantees dark background during element exports -->
  <div id="capture-wrapper">
    <div class="timeline" id="semesterTimeline"></div>
  </div>

  <script>
    // -------------------------------------------------------------
    // SETUP YOUR START DATE HERE:
    // Put your start date inside Date("YYYY-MM-DD")
    // -------------------------------------------------------------
    const startDate = new Date("2026-09-07"); 
    const totalWeeks = 14;

    const today = new Date();
    today.setHours(0,0,0,0);
    startDate.setHours(0,0,0,0);

    const timeDiff = today - startDate;
    const daysPassed = Math.floor(timeDiff / (1000 * 60 * 60 * 24));

    const timelineContainer = document.getElementById('semesterTimeline');
    let dayCounter = 0;

    // Loop 14 times to create 14 rows
    for (let w = 1; w <= totalWeeks; w++) {
      // 1. Create a row container
      const row = document.createElement('div');
      row.classList.add('week-row');

      // 2. Create the Week Label (W1, W2, etc.)
      const label = document.createElement('div');
      label.classList.add('week-label');
      label.innerText = 'W' + w;
      row.appendChild(label);

      // 3. Create the 7-day grid block for this week
      const daysGrid = document.createElement('div');
      daysGrid.classList.add('days-grid');

      for (let d = 0; d < 7; d++) {
        const dayBox = document.createElement('div');
        dayBox.classList.add('day');
        dayBox.innerText = dayCounter + 1;

        // Check if day is past, present, or future
        if (dayCounter < daysPassed) {
          dayBox.classList.add('past'); 
        } else if (dayCounter === daysPassed) {
          dayBox.classList.add('current'); 
        }
        
        daysGrid.appendChild(dayBox);
        dayCounter++; // Move to next total day number
      }

      row.appendChild(daysGrid);
      timelineContainer.appendChild(row);
    }
  </script>
</body>
</html>
