<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semester Progress</title>
  <style>
    /* 1. Page layout & background configuration */
    html, body {
      background: url('IMG_4290.jpeg') no-repeat center center fixed !important;
      background-size: cover !important;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* Safely centers without pushing top off-screen */
      justify-content: center;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    #capture-wrapper {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Padding keeps content clear of lockscreen elements */
      padding: 40px 16px 100px 16px;
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* 2. Transparent background lets the photo show through */
    .timeline {
      display: flex;
      flex-direction: column;
      gap: 5px;
      background: rgba(0, 0, 0, 0.35); /* Subtle dark overlay for contrast */
      padding: 12px;
      border-radius: 14px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .week-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .week-label {
      font-size: 11px;
      color: #ffffff;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      font-weight: bold;
      width: 24px;
      text-align: right;
    }

    .days-grid { 
      display: grid; 
      grid-template-columns: repeat(7, 1fr); 
      gap: 4px; 
    }

    /* Slightly smaller day boxes to fit 14 weeks cleanly on iPhone screens */
    .day { 
      width: 26px; 
      height: 26px; 
      border-radius: 5px; 
      border: 1px solid rgba(255, 255, 255, 0.25); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 9px; 
      color: #ffffff; 
      font-weight: bold;
      background-color: rgba(0, 0, 0, 0.4);
      box-sizing: border-box;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }

    /* Days finished */
    .past { 
      background-color: #2ed573 !important; 
      border-color: #2ed573 !important; 
      color: #000000 !important; 
      text-shadow: none;
    }

    /* Today */
    .current { 
      background-color: #ffa502 !important; 
      border-color: #ffa502 !important; 
      color: black !important; 
      box-shadow: 0 0 10px #ffa502;
      text-shadow: none;
    }

    /* Print & Screenshot overrides */
    @media print {
      @page {
        margin: 0;
        size: auto;
      }
      html, body {
        background: url('IMG_4290.jpeg') no-repeat center center !important;
        background-size: cover !important;
        height: 100vh !important;
        width: 100vw !important;
        justify-content: center !important;
        align-items: center !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      .day, .timeline {
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
    }
  </style>
</head>
<body>

  <div id="capture-wrapper">
    <div class="timeline" id="semesterTimeline"></div>
  </div>

  <script>
    const startDate = new Date("2026-09-07"); 
    const totalWeeks = 14;

    const today = new Date();
    today.setHours(0,0,0,0);
    startDate.setHours(0,0,0,0);

    const timeDiff = today - startDate;
    const daysPassed = Math.floor(timeDiff / (1000 * 60 * 60 * 24));

    const timelineContainer = document.getElementById('semesterTimeline');
    let dayCounter = 0;

    for (let w = 1; w <= totalWeeks; w++) {
      const row = document.createElement('div');
      row.classList.add('week-row');

      const label = document.createElement('div');
      label.classList.add('week-label');
      label.innerText = 'W' + w;
      row.appendChild(label);

      const daysGrid = document.createElement('div');
      daysGrid.classList.add('days-grid');

      for (let d = 0; d < 7; d++) {
        const dayBox = document.createElement('div');
        dayBox.classList.add('day');
        dayBox.innerText = dayCounter + 1;

        if (dayCounter < daysPassed) {
          dayBox.classList.add('past'); 
        } else if (dayCounter === daysPassed) {
          dayBox.classList.add('current'); 
        }
        
        daysGrid.appendChild(dayBox);
        dayCounter++;
      }

      row.appendChild(daysGrid);
      timelineContainer.appendChild(row);
    }
  </script>
</body>
</html>
