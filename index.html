<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Semester Progress</title>
  <style>
    body { 
      background: #121212; 
      color: white; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      height: 100vh; 
      margin: 0; 
      box-sizing: border-box;
    }
    h2 { 
      margin-bottom: 30px; 
      font-weight: 500; 
      letter-spacing: 1px;
      color: #eaeaea;
    }
    .grid { 
      display: grid; 
      grid-template-columns: repeat(7, 1fr); 
      gap: 10px; 
      max-width: 90vw;
    }
    .day { 
      width: 40px; 
      height: 40px; 
      border-radius: 8px; 
      border: 2px solid #333; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 11px; 
      color: #666; 
      font-weight: bold;
    }
    /* Days you have finished */
    .past { 
      background-color: #2ed573; 
      border-color: #2ed573; 
      color: #121212; 
    }
    /* Today */
    .current { 
      background-color: #ffa502; 
      border-color: #ffa502; 
      color: black; 
      box-shadow: 0 0 15px #ffa502;
    }
  </style>
</head>
<body>

  <h2>SEMESTER PROGRESS</h2>
  <div class="grid" id="semesterGrid"></div>

  <script>
    // -------------------------------------------------------------
    // SETUP YOUR DATES HERE:
    // Put your start date inside Date("YYYY-MM-DD")
    // -------------------------------------------------------------
    const startDate = new Date("2026-09-07"); 
    const totalDays = 98; // 14 weeks * 7 days

    // Clear time strictly to calculate full days accurately
    const today = new Date();
    today.setHours(0,0,0,0);
    startDate.setHours(0,0,0,0);

    const timeDiff = today - startDate;
    const daysPassed = Math.floor(timeDiff / (1000 * 60 * 60 * 24));

    const gridContainer = document.getElementById('semesterGrid');

    for (let i = 0; i < totalDays; i++) {
      const dayBox = document.createElement('div');
      dayBox.classList.add('day');
      dayBox.innerText = i + 1;

      if (i < daysPassed) {
        dayBox.classList.add('past'); 
      } else if (i === daysPassed) {
        dayBox.classList.add('current'); 
      }
      
      gridContainer.appendChild(dayBox);
    }
  </script>
</body>
</html>
